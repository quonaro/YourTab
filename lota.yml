dev:
  desc: Run development
  script: |
    pnpm dev

build:
  desc: Build extension
  script: |
    pnpm build

push:
  desc: Push to GitHub
  color: cyan
  args:
    - "tag:str?"
  script: |
    if [ -n "$tag" ]; then
      git tag -f "$tag"
      git push origin "$tag" --force
      git push
    else
      git push origin main
    fi
